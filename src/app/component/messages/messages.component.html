<app-navbar></app-navbar>

<div class="min-h-screen pt-16 bg-gradient-to-br from-slate-50 via-indigo-50 to-cyan-50
            dark:from-slate-950 dark:via-slate-900 dark:to-slate-950">
  <div class="mx-auto max-w-4xl px-4 py-6">
    <!-- Shell -->
    <div class="rounded-3xl p-[1px] bg-gradient-to-br from-indigo-500/30 via-cyan-500/20 to-fuchsia-500/20 shadow-lg shadow-indigo-500/10">
      <div class="rounded-[calc(theme(borderRadius.3xl)-1px)] bg-white/85 dark:bg-slate-900/70 ring-1 ring-black/5 dark:ring-white/10">

        <!-- Header -->
        <div class="flex items-start md:items-center justify-between gap-3 p-5 pb-3">
          <div>
            <h1 class="text-xl md:text-2xl font-bold text-slate-900 dark:text-white">Messages</h1>
            <p class="text-sm text-slate-600 dark:text-slate-300">Les plus récents en premier</p>
          </div>
        </div>

        <!-- Composer (admin/instructor) -->
      
        <div class="px-5 pb-4">
        <div class="rounded-2xl ring-1 ring-slate-200 dark:ring-slate-800 bg-white/80 dark:bg-slate-800/50 p-4">
            <div class="grid gap-3 md:grid-cols-[minmax(0,1fr)_220px]">
            <textarea [(ngModel)]="newMessage" rows="3" placeholder="Écrire un message pour une classe…"
                        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm
                            focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-slate-900
                            dark:border-slate-700 dark:text-slate-100"></textarea>

            <div class="flex md:flex-col gap-2">
                <!-- choose class -->
                <select [(ngModel)]="selectedClassId"
                        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm
                            focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
                <!-- IMPORTANT: no 'selected' attribute (Angular controls selection) -->
                <option [ngValue]="''" disabled>Choisir la classe…</option>
                <ng-container *ngIf="myIndex$ | async as idx">
                    <option *ngFor="let c of idx" [ngValue]="c.classId">{{ c.title || c.classId }}</option>
                </ng-container>
                </select>

                <button (click)="send()"
                        [disabled]="sending || !selectedClassId || !newMessage.trim()"
                        class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 disabled:opacity-60">
                <svg *ngIf="sending" class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity=".2" stroke-width="4"></circle>
                    <path d="M22 12a10 10 0 0 1-10 10" stroke="currentColor" stroke-width="4"></path>
                </svg>
                <span>{{ sending ? 'Publication…' : 'Publier' }}</span>
                </button>
            </div>
            </div>
            <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">Seuls les administrateurs/instructeurs devraient publier.</p>

            <!-- tiny error notice -->
            <p *ngIf="errorMsg" class="mt-2 text-xs text-rose-600">{{ errorMsg }}</p>
        </div>
        </div>

        <!-- Feed -->
        <div class="px-5 pb-6">
          <ng-container *ngIf="messages$ | async as msgs; else loading">
            <div *ngIf="msgs.length; else empty" class="space-y-3">
              <article *ngFor="let m of msgs" class="group rounded-2xl bg-white/80 dark:bg-slate-800/60 ring-1 ring-slate-200 dark:ring-slate-800 p-4 hover:-translate-y-0.5 hover:ring-indigo-300/60 hover:shadow transition">
                <div class="flex items-start justify-between gap-3">
                  <div class="min-w-0">
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="inline-flex items-center rounded-lg px-2 py-0.5 text-[11px] font-semibold ring-1 ring-indigo-200 text-indigo-700 bg-indigo-50
                                   dark:ring-indigo-800 dark:text-indigo-200 dark:bg-indigo-900/20">
                        {{ m.classTitle }}
                      </span>
                      <span class="text-xs text-slate-500 dark:text-slate-400">• {{ m.createdAtDate | date:'medium' }}</span>
                    </div>
                    <div class="mt-1 text-sm text-slate-900 dark:text-slate-100 whitespace-pre-wrap break-words">
                      {{ m.text }}
                    </div>
                  </div>
                  <div class="shrink-0 grid place-items-center h-8 w-8 rounded-full bg-gradient-to-tr from-indigo-600 to-cyan-600 text-[11px] font-bold text-white">
                    {{ (m.authorName || '—') | slice:0:2 | uppercase }}
                  </div>
                </div>
              </article>
            </div>
          </ng-container>

          <ng-template #empty>
            <div class="text-sm text-slate-600 dark:text-slate-300">Aucun message pour l’instant.</div>
          </ng-template>
          <ng-template #loading>
            <div class="space-y-3">
              <div *ngFor="let i of [1,2,3,4]" class="h-20 rounded-2xl bg-slate-100/70 dark:bg-slate-800/40 animate-pulse ring-1 ring-slate-200/70 dark:ring-slate-800"></div>
            </div>
          </ng-template>
        </div>

      </div>
    </div>
  </div>
</div>
